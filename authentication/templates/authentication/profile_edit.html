{% extends "authentication/base_logged_in.html" %}
{% load static %}

{% block title %}Edit Profile - SriPedia{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}?v={% now 'U' %}">
{% endblock %}

{% block content %}
<div class="content-container">
    <div class="profile-header">
        <h1>Edit Profile</h1>
        <a href="{% url 'profile' %}" class="btn btn-secondary">Back to Profile</a>
    </div>

    <div class="profile-edit-container">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="avatar">Profile Picture</label>
                <div class="avatar-upload">
                    <div class="avatar-preview">
                        <img src="{{ user_profile.avatar.url|default:'https://via.placeholder.com/150' }}" alt="Profile picture" id="avatarPreview">
                    </div>
                    <div class="avatar-edit">
                        <input type="file" id="avatar" name="avatar" accept=".jpg,.jpeg,.png">
                        <label for="avatar">Change Picture</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ user.username }}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" required>
            </div>
            
            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="4">{{ user_profile.bio }}</textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Preview uploaded avatar
        const avatarInput = document.getElementById('avatar');
        const avatarPreview = document.getElementById('avatarPreview');
        
        avatarInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarPreview.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });
    });
</script>
{% endblock %}
